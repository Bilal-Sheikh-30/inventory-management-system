<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Info</title>
</head>
<body>
    {% if messages %}
    {% for msg in messages %}
        <p>{{msg}}</p>
    {% endfor %}
    {% endif %}

    {% if logined_user_info %}
    <form method="post">
        {% csrf_token %}
        <label for="EmpID">EmpID: </label>
        <input type="text" name="EmpID" id="EmpID" value='{{logined_user_info.id}}' disabled>

        <label for="username">Username: </label>
        <input type="text" name="username" id="username" value='{{logined_user_info.username}}'>

        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" id="first_name" value='{{logined_user_info.first_name}}'>

        <label for="last_name">Last Name:</label>
        <input type="text" name="last_name" id="last_name" value='{{logined_user_info.last_name}}'>
        
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" value='{{logined_user_info.email}}'>

        <label for="status">Status:</label>
        <input type="text" name="status" id="status" value='{{logined_user_info.status}}' disabled>

        <label for="Dept_name">Department:</label>
        <input type="text" name="Dept_name" id="Dept_name" value='{{Dept_name}}' disabled>

        <input type="submit" value="Save Changes">
        <input type="reset" value="Undo Changes">
    </form>
    
    {% else %}
    <h3>No information to display. Contact Admin.</h3>
    {% endif %}
    <a href="{% url 'home' %}">Go Back</a>
</body>
</html>
